<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      div {
        width: 100%;
        height: calc(100vh - 1em);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      span:nth-child(1),
      span:nth-child(4) {
        color: rgb(49, 134, 255);
      }
      span:nth-child(6),
      span:nth-child(2) {
        color: rgb(252, 65, 61);
      }
      span:nth-child(3) {
        color: rgb(255, 190, 0);
      }
      span:nth-child(5) {
        color: rgb(0, 175, 87);
      }
    </style>
    <title>실습 3.5</title>
  </head>
  <body>
    <div>
      <h1>
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span
        ><span>e</span>
      </h1>
    </div>
  </body>
</html>
