<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 실습 3 - 반복문 사용하기</title>
</head>
<body>
    <script>
        const scores = [66, 78, 56, 19, 54, 57, 87, 94, 77, 68, 88, 87, 60, 55, 43, 76, 93, 56, 89, 79, 71];
        let ave, max=0, sum=0;

        for (let score of scores) {
            sum += score;
            if (score > max) {
                max = score;
            }
        }

        avg = sum / scores.length
        
        console.log(`가장 높은 점수는 ${max}점입니다.`);
        console.log(`평균 점수는 ${avg.toFixed(1)}점입니다.`);
    </script>
</body>
</html>
